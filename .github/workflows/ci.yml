# SPDX-License-Identifier: GPL-3.0-or-later
name: CI

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          clang --version
          cmake --version
          ppdc --version || true

      - name: Build
        run: ./build.sh

      - name: Assert arm64 only
        run: |
          archs=$(lipo -archs out/rastertobrlaser)
          echo "arch: $archs"
          test "$archs" = "arm64"

      - name: Test
        run: ./test.sh

      - name: Check scripts parse
        run: |
          for f in build.sh install.sh uninstall.sh migrate.sh test.sh; do
            bash -n "$f"
          done

      - name: Check license headers
        run: |
          missing=0
          for f in $(git ls-files | grep -v '^vendor/'); do
            case "$f" in
              LICENSE|README.md|NOTICE.md|CHANGELOG.md|VERSION|\
              vendor/*|.gitignore) continue ;;
            esac
            grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$f" || {
              echo "missing SPDX header: $f"; missing=1
            }
          done
          exit $missing
